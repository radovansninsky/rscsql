plugins {
  id 'java'
  id 'maven-publish'
}

group "sk.rsc"

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'org.testng:testng:7.5.1'
  testImplementation 'com.h2database:h2:2.2.220'
  testImplementation 'org.postgresql:postgresql:42.7.7'
}

java {
  withSourcesJar()
  withJavadocJar()
  toolchain {
    languageVersion = JavaLanguageVersion.of(8)
  }
}

jar {
  manifest {
    attributes(
      'Implementation-Title': 'RSC Sql library',
      'Implementation-Version': version,
      'Implementation-Vendor': 'Radovan Sninsky',
      'Build-Time': new Date().format('yyyy-MM-dd_HH-mm-ss')
    )
  }
}

javadoc {
  source = sourceSets.main.allJava
  options.overview = "src/main/java/overview.html"
}

tasks.named('test', Test) {
  useTestNG()
}

publishing {
  publications {
    gpr(MavenPublication) {
      from components.java
    }
  }

  // telling gradle to publish artifact to repo
  repositories {
    maven {
      name = "GitHubPackages"
      url = uri("https://maven.pkg.github.com/radovansninsky/rscsql")
      credentials {
        username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_TOKEN")
        password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
      }
    }
  }
}
