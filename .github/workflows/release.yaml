name: Build

on:
  release:
    types: [ created ]
    tags: [ 'v*' ]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Get version
        run: echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_ENV

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and publish with Gradle Wrapper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -Pversion=$VERSION

      - name: Upload lib asset
        uses: actions/upload-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: build/libs/rscsql-${{ env.VERSION }}.jar
          asset_name: rscsql-${{ env.VERSION }}.jar
          asset_content_type: application/jar
